# The only workflow that produces installables. Never rename this file:
# versionCode = github.run_number of THIS workflow, and a reset counter would
# make new APKs look like downgrades.
name: build

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Get packages
        run: flutter pub get

      - name: Generated code is committed and fresh
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git status --porcelain
          git diff --exit-code
          if [ -n "$(git status --porcelain --untracked-files=all -- lib test)" ]; then
            echo "::error::Generated files are missing from the commit; run build_runner and commit them."
            exit 1
          fi

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --exclude-tags network,bench

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android APKs
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="0.0.0-dev"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Building $name ($BUILD_NUMBER)"

      - name: Release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
            # java.util.Properties treats backslash as an escape character.
            esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
            {
              echo "storeFile=release.jks"
              echo "storePassword=$(esc "$KEYSTORE_PASSWORD")"
              echo "keyAlias=$(esc "$KEY_ALIAS")"
              echo "keyPassword=$(esc "$KEY_PASSWORD")"
            } > android/key.properties
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "release=1" >> "$GITHUB_OUTPUT"
            echo "Signing with the release key."
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "::error::Release signing secrets are missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD before tagging a release."
            exit 1
          else
            echo "::warning::Release signing secrets are not set; these APKs are debug-signed and cannot be updated by release builds. Do not install them on your devices."
            echo "suffix=-debug-signed" >> "$GITHUB_OUTPUT"
            echo "release=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Get packages
        run: flutter pub get

      - name: Build split APKs
        run: >
          flutter build apk --release --split-per-abi
          --target-platform android-arm,android-arm64
          --build-name "${{ steps.version.outputs.name }}"
          --build-number "$BUILD_NUMBER"
          -P force-version-code-ignoring-abi=true

      - name: Collect split APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/iptv-player-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/iptv-player-arm64-v8a.apk

      - name: Build universal APK
        run: >
          flutter build apk --release
          --target-platform android-arm,android-arm64
          --build-name "${{ steps.version.outputs.name }}"
          --build-number "$BUILD_NUMBER"
          -P force-version-code-ignoring-abi=true

      - name: Collect universal APK
        run: cp build/app/outputs/flutter-apk/app-release.apk dist/iptv-player-universal.apk

      - name: Check APKs
        env:
          REQUIRE_RELEASE_SIGNED: ${{ steps.signing.outputs.release }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ -f .github/release-cert.sha256 ]; then
            EXPECTED_CERT_SHA256="$(tr -d '[:space:]' < .github/release-cert.sha256)"
            export EXPECTED_CERT_SHA256
          fi
          bash tool/check_apk.sh dist/iptv-player-universal.apk 90 "armeabi-v7a arm64-v8a"
          bash tool/check_apk.sh dist/iptv-player-armeabi-v7a.apk 90 "armeabi-v7a"
          bash tool/check_apk.sh dist/iptv-player-arm64-v8a.apk 90 "arm64-v8a"
          ls -la dist

      - name: Remove signing material
        if: always()
        run: rm -f android/app/release.jks android/key.properties

      - uses: actions/upload-artifact@v7
        with:
          name: iptv-player-android${{ steps.signing.outputs.suffix }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows zip
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Get packages
        run: flutter pub get

      - name: Build
        run: flutter build windows --release --build-name "${{ steps.version.outputs.name }}" --build-number "${{ env.BUILD_NUMBER }}"

      - name: Package portable zip
        shell: pwsh
        run: |
          $release = 'build/windows/x64/runner/Release'
          # App-local VC++ runtime so the zip runs on PCs without the redistributable.
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item -Path (Join-Path $env:WINDIR "System32\$dll") -Destination $release -Force
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$release/*" -DestinationPath dist/iptv-player-windows-x64.zip -Force
          Get-ChildItem dist

      - uses: actions/upload-artifact@v7
        with:
          name: iptv-player-windows
          path: dist/iptv-player-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- *.apk *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/iptv-player-universal.apk
            dist/iptv-player-armeabi-v7a.apk
            dist/iptv-player-arm64-v8a.apk
            dist/iptv-player-windows-x64.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            **أي ملف أنزّل؟** إذا ما أنت متأكد نزّل `iptv-player-universal.apk`. أجهزة Fire TV Stick والبوكسات الرخيصة: `armeabi-v7a`. الجوالات الحديثة و Shield و Google TV: `arm64-v8a`. الكمبيوتر: `iptv-player-windows-x64.zip`. طريقة التثبيت: https://github.com/${{ github.repository }}/blob/main/docs/INSTALL_AR.md

            **Which file?** Not sure: `iptv-player-universal.apk`. Fire TV Stick and cheap boxes: `armeabi-v7a`. Modern phones, Shield, Google TV: `arm64-v8a`. PC: `iptv-player-windows-x64.zip`.

            TV download link: `https://github.com/${{ github.repository }}/releases/latest/download/iptv-player-universal.apk`

            The app is a player only and ships no channels or playlists. / التطبيق مشغّل فقط وما فيه أي قنوات أو قوائم.
